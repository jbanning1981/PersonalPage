name: Manually Publish Azure Static Web App

on: [workflow_dispatch]

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    defaults:
      run:
        working-directory: personalpage
    steps:
      - uses: actions/checkout@v5

      # Build here rather than in the Azure action, so the Node version and the
      # build steps (including the pre-render) are the same as CI and local builds.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personalpage/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_SAND_0264C0910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "personalpage/dist/personalpage" # Already-built site from the steps above
          api_location: ""
          skip_app_build: true
