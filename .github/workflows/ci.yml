name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personalpage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personalpage/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the page was pre-rendered
        run: grep -q "Work History" dist/personalpage/index.html
